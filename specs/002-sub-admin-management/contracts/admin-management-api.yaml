openapi: 3.0.3
info:
  title: 관리자 계정 관리 API
  description: 슈퍼 어드민이 하위 관리자 계정을 생성하고 관리하는 API 스펙
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버
  - url: ${API_BASE_URL}
    description: 프로덕션 서버

paths:
  /api/admin/auth/admins:
    post:
      summary: 관리자 계정 생성 (슈퍼 어드민 전용)
      description: 슈퍼 어드민이 하위 관리자 계정을 생성합니다. 생성된 계정은 즉시 로그인 가능하며 관리자 목록에 추가됩니다.
      operationId: createAdmin
      tags:
        - Admin Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
            examples:
              valid:
                value:
                  name: 홍길동
                  email: hong@example.com
                  password: password123
                  role: ADMIN
      responses:
        '201':
          description: 관리자 계정 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdminResponse'
              examples:
                success:
                  value:
                    id: admin-456
                    email: hong@example.com
                    name: 홍길동
                    role: ADMIN
                    createdAt: '2025-01-19T10:30:00Z'
                    message: 관리자 계정이 생성되었습니다
        '400':
          description: 잘못된 요청 (필수 필드 누락, 형식 오류, 비밀번호 길이 부족)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  value:
                    message: 필수 필드를 모두 입력해주세요
                invalidEmail:
                  value:
                    message: 유효하지 않은 이메일 형식입니다
                shortPassword:
                  value:
                    message: 비밀번호는 최소 8자 이상이어야 합니다
        '401':
          description: 인증되지 않은 요청 (토큰 없음 또는 만료)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    message: 인증이 필요합니다
        '403':
          description: 권한 없음 (슈퍼 어드민이 아님)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    message: 관리자 계정을 생성할 권한이 없습니다
        '409':
          description: 이메일 중복 (이미 존재하는 이메일)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateEmail:
                  value:
                    message: 이미 사용 중인 이메일입니다
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: 서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요

    get:
      summary: 관리자 목록 조회
      description: 시스템에 등록된 모든 관리자 계정 목록을 조회합니다. 최신 생성 순서로 정렬됩니다.
      operationId: getAdminList
      tags:
        - Admin Management
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 관리자 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListResponse'
              examples:
                success:
                  value:
                    admins:
                      - id: admin-123
                        email: admin@example.com
                        name: 관리자
                        role: SUPER_ADMIN
                        createdAt: '2025-01-01T00:00:00Z'
                        lastLoginAt: '2025-01-19T09:00:00Z'
                      - id: admin-456
                        email: hong@example.com
                        name: 홍길동
                        role: ADMIN
                        createdAt: '2025-01-19T10:30:00Z'
                        lastLoginAt: null
        '401':
          description: 인증되지 않은 요청 (토큰 없음 또는 만료)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    message: 인증이 필요합니다
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: 서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 토큰을 Bearer 스킴으로 전송. 슈퍼 어드민 권한이 필요한 엔드포인트는 토큰의 role이 SUPER_ADMIN이어야 함

  schemas:
    CreateAdminRequest:
      type: object
      required:
        - name
        - email
        - password
        - role
      properties:
        name:
          type: string
          description: 관리자 이름
          example: 홍길동
          minLength: 1
        email:
          type: string
          format: email
          description: 관리자 이메일 주소 (시스템 내 고유해야 함)
          example: hong@example.com
        password:
          type: string
          format: password
          description: 임시 비밀번호 (최소 8자 이상)
          example: password123
          minLength: 8
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - ADMIN
            - CONTENT_ADMIN
            - CUSTOMER_SUPPORT
          description: 관리자 역할
          example: ADMIN

    CreateAdminResponse:
      type: object
      required:
        - id
        - email
        - name
        - role
        - createdAt
      properties:
        id:
          type: string
          description: 생성된 관리자 고유 식별자
          example: admin-456
        email:
          type: string
          format: email
          description: 관리자 이메일
          example: hong@example.com
        name:
          type: string
          description: 관리자 이름
          example: 홍길동
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - ADMIN
            - CONTENT_ADMIN
            - CUSTOMER_SUPPORT
          description: 관리자 역할
          example: ADMIN
        createdAt:
          type: string
          format: date-time
          description: 계정 생성 일시 (ISO 8601 형식)
          example: '2025-01-19T10:30:00Z'
        message:
          type: string
          description: 응답 메시지
          example: 관리자 계정이 생성되었습니다

    AdminListItem:
      type: object
      required:
        - id
        - email
        - name
        - role
        - createdAt
        - lastLoginAt
      properties:
        id:
          type: string
          description: 관리자 고유 식별자
          example: admin-456
        email:
          type: string
          format: email
          description: 관리자 이메일
          example: hong@example.com
        name:
          type: string
          description: 관리자 이름
          example: 홍길동
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - ADMIN
            - CONTENT_ADMIN
            - CUSTOMER_SUPPORT
          description: 관리자 역할
          example: ADMIN
        createdAt:
          type: string
          format: date-time
          description: 계정 생성 일시 (ISO 8601 형식)
          example: '2025-01-19T10:30:00Z'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막 로그인 일시 (ISO 8601 형식, 로그인 전에는 null)
          example: '2025-01-19T09:00:00Z'

    AdminListResponse:
      type: object
      required:
        - admins
      properties:
        admins:
          type: array
          description: 관리자 목록 (최신 생성 순서로 정렬)
          items:
            $ref: '#/components/schemas/AdminListItem'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: 에러 메시지
          example: 이미 사용 중인 이메일입니다
        error:
          type: string
          description: 에러 코드 (선택적)
          example: DUPLICATE_EMAIL
        details:
          type: object
          description: 추가 에러 정보 (선택적)
