openapi: 3.0.3
info:
  title: 공지사항 관리 API
  description: 관리자 공지사항 등록, 조회, 수정, 삭제 API 스펙
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버
  - url: ${API_BASE_URL}
    description: 프로덕션 서버

paths:
  /api/notices:
    get:
      summary: 공지사항 리스트 조회
      description: 검색, 페이지네이션을 지원하는 공지사항 목록 조회 (공개 API)
      operationId: getNotices
      tags:
        - Notices
      parameters:
        - name: search
          in: query
          description: 검색 키워드 (제목/본문)
          required: false
          schema:
            type: string
          example: 시스템 업데이트
        - name: limit
          in: query
          description: 한 페이지에 표시할 아이템 수
          required: false
          schema:
            type: integer
            default: 20
          example: 20
        - name: offset
          in: query
          description: 건너뛸 아이템 수 (페이지 번호 * limit)
          required: false
          schema:
            type: integer
            default: 0
          example: 0
      responses:
        '200':
          description: 공지사항 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeListResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      items:
                        - id: "d4079ee8-c33a-4587-84c3-4438f8efb095"
                          title: "시스템 업데이트 안내"
                          imageUrl: "https://example.com/image.jpg"
                          isPinned: false
                          createdAt: "2026-01-21T13:44:42.057Z"
                      total: 1
                      limit: 20
                      offset: 0
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/notices/{id}:
    get:
      summary: 공지사항 상세 조회
      description: 특정 공지사항의 상세 정보를 조회합니다 (공개 API)
      operationId: getNoticeById
      tags:
        - Notices
      parameters:
        - name: id
          in: path
          description: 공지사항 ID
          required: true
          schema:
            type: string
            format: uuid
          example: "d4079ee8-c33a-4587-84c3-4438f8efb095"
      responses:
        '200':
          description: 공지사항 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeDetailResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      id: "d4079ee8-c33a-4587-84c3-4438f8efb095"
                      title: "시스템 업데이트 안내"
                      content: "2026년 1월 20일 새벽 2시부터 4시까지 시스템 정기 점검이 예정되어 있습니다."
                      imageUrl: "https://example.com/image.jpg"
                      isPinned: false
                      createdAt: "2026-01-21T13:44:42.057Z"
                      updatedAt: null
        '404':
          description: 공지사항을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/notices:
    post:
      summary: 공지사항 작성
      description: 새로운 공지사항을 등록합니다
      operationId: createNotice
      tags:
        - Admin Notices
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoticeRequest'
            examples:
              basic:
                value:
                  title: "시스템 업데이트 안내"
                  content: "2026년 1월 20일 새벽 2시부터 4시까지 시스템 정기 점검이 예정되어 있습니다."
                  imageUrl: "https://example.com/image.jpg"
                  isPinned: false
                  isVisible: true
              pinned:
                value:
                  title: "[필독] 중요 공지사항"
                  content: "중요한 공지사항입니다."
                  isPinned: true
                  isVisible: true
      responses:
        '200':
          description: 공지사항 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateNoticeResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      id: "d4079ee8-c33a-4587-84c3-4438f8efb095"
                      title: "시스템 업데이트 안내"
                      content: "2026년 1월 20일 새벽 2시부터 4시까지 시스템 정기 점검이 예정되어 있습니다."
                      imageUrl: "https://example.com/image.jpg"
                      isPinned: false
                      isVisible: true
                      createdAt: "2026-01-21T13:44:42.057Z"
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/notices/{id}:
    patch:
      summary: 공지사항 수정
      description: 공지사항 정보를 부분 업데이트합니다
      operationId: updateNotice
      tags:
        - Admin Notices
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 공지사항 ID
          required: true
          schema:
            type: string
            format: uuid
          example: "d4079ee8-c33a-4587-84c3-4438f8efb095"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoticeRequest'
            examples:
              updateTitle:
                value:
                  title: "수정된 제목"
              updatePinned:
                value:
                  isPinned: true
              updateAll:
                value:
                  title: "수정된 제목"
                  content: "수정된 내용"
                  imageUrl: "https://example.com/new-image.jpg"
                  isPinned: true
                  isVisible: true
      responses:
        '200':
          description: 공지사항 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 공지사항을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: 공지사항 삭제
      description: 공지사항을 삭제합니다
      operationId: deleteNotice
      tags:
        - Admin Notices
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 공지사항 ID
          required: true
          schema:
            type: string
            format: uuid
          example: "d4079ee8-c33a-4587-84c3-4438f8efb095"
      responses:
        '200':
          description: 공지사항 삭제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 공지사항을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Notice:
      type: object
      required:
        - id
        - title
        - content
        - isPinned
        - isVisible
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 공지사항 고유 식별자
        title:
          type: string
          description: 공지사항 제목
        content:
          type: string
          description: 공지사항 내용
        imageUrl:
          type: string
          nullable: true
          description: 이미지 URL
        isPinned:
          type: boolean
          description: 고정 여부
        isVisible:
          type: boolean
          description: 공개 여부
        createdAt:
          type: string
          format: date-time
          description: 생성 일시
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: 수정 일시

    NoticeListItem:
      type: object
      required:
        - id
        - title
        - isPinned
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 공지사항 고유 식별자
        title:
          type: string
          description: 공지사항 제목
        imageUrl:
          type: string
          nullable: true
          description: 이미지 URL
        isPinned:
          type: boolean
          description: 고정 여부
        createdAt:
          type: string
          format: date-time
          description: 생성 일시

    NoticeListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - items
            - total
            - limit
            - offset
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NoticeListItem'
            total:
              type: integer
              description: 전체 공지사항 개수
            limit:
              type: integer
              description: 페이지 크기
            offset:
              type: integer
              description: 페이지 오프셋

    NoticeDetailResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Notice'

    CreateNoticeRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          description: 공지사항 제목
        content:
          type: string
          description: 공지사항 내용
        imageUrl:
          type: string
          description: 이미지 URL
        isPinned:
          type: boolean
          default: false
          description: 고정 여부
        isVisible:
          type: boolean
          default: true
          description: 공개 여부

    CreateNoticeResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Notice'

    UpdateNoticeRequest:
      type: object
      properties:
        title:
          type: string
          description: 공지사항 제목
        content:
          type: string
          description: 공지사항 내용
        imageUrl:
          type: string
          description: 이미지 URL
        isPinned:
          type: boolean
          description: 고정 여부
        isVisible:
          type: boolean
          description: 공개 여부

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: 에러 메시지
        message:
          type: string
          description: 에러 메시지 (대체)
