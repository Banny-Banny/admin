openapi: 3.0.3
info:
  title: 상품 관리 API
  description: 관리자 상품 등록, 조회, 수정, 삭제 API 스펙
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버
  - url: ${API_BASE_URL}
    description: 프로덕션 서버

paths:
  /api/admin/products:
    get:
      summary: 상품 리스트 조회
      description: 검색, 필터링, 페이지네이션을 지원하는 상품 목록 조회
      operationId: getProducts
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          description: 검색어(상품명)
          required: false
          schema:
            type: string
          example: 타임캡슐
        - name: categoryId
          in: query
          description: 카테고리 ID
          required: false
          schema:
            type: string
            format: uuid
          example: b3f1df7b-6b13-4bf5-b0f8-0f8c3a1b0a01
        - name: status
          in: query
          description: 상태 필터
          required: false
          schema:
            type: string
            enum: [ALL, ACTIVE, INACTIVE, DELETED]
            default: ALL
          example: ACTIVE
        - name: limit
          in: query
          description: 페이지 크기
          required: false
          schema:
            type: integer
            default: 20
          example: 20
        - name: offset
          in: query
          description: 페이지 오프셋
          required: false
          schema:
            type: integer
            default: 0
          example: 0
      responses:
        '200':
          description: 상품 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      items:
                        - id: "5cf7f256-e3c0-4c67-a99a-805d0d3508fc"
                          name: "기본상품"
                          price: 1000
                          description: null
                          thumbnailUrl: null
                          categoryId: null
                          productType: "TIME_CAPSULE"
                          mediaTypes: []
                          maxMediaCount: 6
                          isActive: true
                          createdAt: "2025-12-29T17:16:49.829Z"
                          updatedAt: null
                          deletedAt: null
                      total: 1
                      limit: 20
                      offset: 0
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: 상품 등록
      description: 새로운 상품을 등록합니다
      operationId: createProduct
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            examples:
              timeCapsule:
                value:
                  name: "100년 타임캡슐"
                  price: 9900
                  description: "100년 뒤에 열리는 타임캡슐"
                  thumbnailUrl: "https://cdn.example.com/products/capsule.png"
                  categoryId: "b3f1df7b-6b13-4bf5-b0f8-0f8c3a1b0a01"
                  isActive: true
                  productType: "TIME_CAPSULE"
                  mediaTypes: ["TEXT"]
                  maxMediaCount: 6
      responses:
        '200':
          description: 상품 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/products/{id}:
    get:
      summary: 상품 상세 조회
      description: 특정 상품의 상세 정보를 조회합니다
      operationId: getProductById
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 상품 ID
          required: true
          schema:
            type: string
            format: uuid
          example: "5cf7f256-e3c0-4c67-a99a-805d0d3508fc"
      responses:
        '200':
          description: 상품 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      id: "5cf7f256-e3c0-4c67-a99a-805d0d3508fc"
                      name: "기본상품"
                      price: 1000
                      description: null
                      thumbnailUrl: null
                      categoryId: null
                      productType: "TIME_CAPSULE"
                      mediaTypes: []
                      maxMediaCount: 6
                      isActive: true
                      createdAt: "2025-12-29T17:16:49.829Z"
                      updatedAt: null
                      deletedAt: null
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 상품을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: 상품 정보 수정
      description: 상품 정보를 부분 업데이트합니다
      operationId: updateProduct
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 상품 ID
          required: true
          schema:
            type: string
            format: uuid
          example: "5cf7f256-e3c0-4c67-a99a-805d0d3508fc"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
            examples:
              updatePrice:
                value:
                  price: 12000
              updateStatus:
                value:
                  isActive: false
      responses:
        '200':
          description: 상품 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 상품을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: 상품 삭제 (Soft Delete)
      description: 상품을 Soft Delete 방식으로 삭제합니다
      operationId: deleteProduct
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 상품 ID
          required: true
          schema:
            type: string
            format: uuid
          example: "5cf7f256-e3c0-4c67-a99a-805d0d3508fc"
      responses:
        '200':
          description: 상품 삭제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "상품이 삭제되었습니다"
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 상품을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - productType
        - mediaTypes
        - maxMediaCount
        - isActive
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 상품 고유 식별자
        name:
          type: string
          description: 상품명
        price:
          type: number
          description: 상품 가격
        description:
          type: string
          nullable: true
          description: 상품 설명
        thumbnailUrl:
          type: string
          nullable: true
          description: 썸네일 이미지 URL
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: 카테고리 ID
        productType:
          type: string
          enum: [TIME_CAPSULE, EASTER_EGG]
          description: 상품 타입
        mediaTypes:
          type: array
          items:
            type: string
          description: 미디어 타입 배열
        maxMediaCount:
          oneOf:
            - type: number
            - type: object
          description: 최대 미디어 개수
        isActive:
          type: boolean
          description: 활성화 여부
        createdAt:
          type: string
          format: date-time
          description: 생성 일시
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: 수정 일시
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: 삭제 일시 (Soft Delete)

    ProductListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - items
            - total
            - limit
            - offset
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Product'
            total:
              type: integer
              description: 전체 상품 개수
            limit:
              type: integer
              description: 페이지 크기
            offset:
              type: integer
              description: 페이지 오프셋

    ProductDetailResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Product'

    CreateProductRequest:
      type: object
      required:
        - name
        - price
        - isActive
        - productType
        - mediaTypes
        - maxMediaCount
      properties:
        name:
          type: string
          description: 상품명
        price:
          type: number
          description: 상품 가격
        description:
          type: string
          description: 상품 설명
        thumbnailUrl:
          type: string
          description: 썸네일 이미지 URL
        categoryId:
          type: string
          format: uuid
          description: 카테고리 ID
        isActive:
          type: boolean
          description: 활성화 여부
        productType:
          type: string
          enum: [TIME_CAPSULE, EASTER_EGG]
          description: 상품 타입
        mediaTypes:
          type: array
          items:
            type: string
          description: 미디어 타입 배열
        maxMediaCount:
          oneOf:
            - type: number
            - type: object
          description: 최대 미디어 개수

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          description: 상품명
        price:
          type: number
          description: 상품 가격
        description:
          type: string
          nullable: true
          description: 상품 설명
        thumbnailUrl:
          type: string
          nullable: true
          description: 썸네일 이미지 URL
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: 카테고리 ID
        isActive:
          type: boolean
          description: 활성화 여부
        productType:
          type: string
          enum: [TIME_CAPSULE, EASTER_EGG]
          description: 상품 타입
        mediaTypes:
          type: array
          items:
            type: string
          description: 미디어 타입 배열
        maxMediaCount:
          oneOf:
            - type: number
            - type: object
          description: 최대 미디어 개수

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: 에러 메시지
        message:
          type: string
          description: 에러 메시지 (대체)
