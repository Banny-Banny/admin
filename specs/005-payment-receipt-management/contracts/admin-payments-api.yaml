openapi: 3.0.3
info:
  title: 관리자 결제 및 영수증 관리 API
  description: 관리자가 결제를 취소하고, 결제 로그를 조회하며, 영수증을 재발급하는 API 스펙
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버
  - url: ${API_BASE_URL}
    description: 프로덕션 서버

paths:
  /api/admin/dashboard/payments/{id}/cancel:
    post:
      summary: 결제 취소
      description: 관리자가 완료된 결제를 취소하고 환불을 처리합니다
      operationId: cancelPayment
      tags:
        - Admin Payments
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 취소할 결제 ID
          schema:
            type: string
          example: payment-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPaymentRequest'
            examples:
              fullRefund:
                value:
                  cancelReason: 고객 요청으로 인한 취소
                  cancelAmount: 50000
              partialRefund:
                value:
                  cancelReason: 부분 환불 요청
                  cancelAmount: 25000
                  refundReceiveAccount:
                    bankName: 국민은행
                    accountNumber: 123456-78-901234
                    accountHolder: 홍길동
      responses:
        '200':
          description: 결제 취소 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelPaymentResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      paymentId: payment-123
                      cancelId: cancel-456
                      cancelAmount: 50000
                      status: CANCELED
                      canceledAt: '2026-01-18T10:30:00Z'
                    message: 결제가 성공적으로 취소되었습니다
        '400':
          description: 잘못된 요청 (필수 필드 누락, 취소 금액 초과 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  value:
                    message: 취소 사유를 입력해주세요
                invalidAmount:
                  value:
                    message: 취소 금액이 결제 금액을 초과할 수 없습니다
        '404':
          description: 결제를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: 해당 결제를 찾을 수 없습니다
        '409':
          description: 결제 취소 불가 (이미 취소됨, 상태 오류 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyCanceled:
                  value:
                    message: 이미 취소된 결제입니다
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/dashboard/payments/logs:
    get:
      summary: 결제 로그 조회
      description: 관리자가 결제 시도, 성공, 실패에 대한 로그를 조회합니다
      operationId: getPaymentLogs
      tags:
        - Admin Payments
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 결제 상태 필터
          schema:
            type: string
            enum: [READY, PAID, CANCELED, FAILED, ALL]
            default: ALL
          example: PAID
        - name: userId
          in: query
          required: false
          description: 사용자 ID 필터
          schema:
            type: string
          example: user-123
        - name: startDate
          in: query
          required: false
          description: 시작 날짜 (ISO 8601)
          schema:
            type: string
            format: date-time
          example: '2026-01-01T00:00:00Z'
        - name: endDate
          in: query
          required: false
          description: 종료 날짜 (ISO 8601)
          schema:
            type: string
            format: date-time
          example: '2026-01-31T23:59:59Z'
        - name: limit
          in: query
          required: false
          description: 페이지 크기
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: offset
          in: query
          required: false
          description: 페이지 오프셋
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: 결제 로그 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLogsResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      items:
                        - id: log-1
                          paymentId: payment-123
                          userId: user-123
                          status: PAID
                          amount: 50000
                          attemptedAt: '2026-01-18T10:00:00Z'
                          failureReason: null
                        - id: log-2
                          paymentId: payment-124
                          userId: user-124
                          status: FAILED
                          amount: 30000
                          attemptedAt: '2026-01-18T09:30:00Z'
                          failureReason: 카드 한도 초과
                      total: 150
                      limit: 20
                      offset: 0
        '400':
          description: 잘못된 요청 (날짜 형식 오류 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/dashboard/receipts/{orderId}/issue:
    post:
      summary: 영수증 재발급
      description: 관리자가 주문에 대한 영수증을 재발급합니다
      operationId: reissueReceipt
      tags:
        - Admin Receipts
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: 주문 ID
          schema:
            type: string
          example: order-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReissueReceiptRequest'
            examples:
              valid:
                value:
                  email: customer@example.com
      responses:
        '200':
          description: 영수증 재발급 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReissueReceiptResponse'
              examples:
                success:
                  value:
                    success: true
                    data:
                      orderId: order-123
                      email: customer@example.com
                      issuedAt: '2026-01-18T10:30:00Z'
                      status: PENDING
                    message: 영수증 재발급이 요청되었습니다
        '400':
          description: 잘못된 요청 (이메일 형식 오류 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmail:
                  value:
                    message: 유효하지 않은 이메일 형식입니다
        '404':
          description: 주문을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: 해당 주문을 찾을 수 없습니다
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 관리자 인증 토큰

  schemas:
    CancelPaymentRequest:
      type: object
      required:
        - cancelReason
        - cancelAmount
      properties:
        cancelReason:
          type: string
          description: 취소 사유
          minLength: 1
          example: 고객 요청으로 인한 취소
        cancelAmount:
          type: number
          description: 취소 금액
          minimum: 1
          example: 50000
        refundReceiveAccount:
          type: object
          description: 환불 계좌 정보 (선택사항)
          properties:
            bankName:
              type: string
              description: 은행명
              example: 국민은행
            accountNumber:
              type: string
              description: 계좌번호
              example: 123456-78-901234
            accountHolder:
              type: string
              description: 예금주명
              example: 홍길동

    CancelPaymentResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - paymentId
            - cancelId
            - cancelAmount
            - status
            - canceledAt
          properties:
            paymentId:
              type: string
              example: payment-123
            cancelId:
              type: string
              example: cancel-456
            cancelAmount:
              type: number
              example: 50000
            status:
              type: string
              enum: [CANCELED]
              example: CANCELED
            canceledAt:
              type: string
              format: date-time
              example: '2026-01-18T10:30:00Z'
        message:
          type: string
          example: 결제가 성공적으로 취소되었습니다

    PaymentLog:
      type: object
      required:
        - id
        - paymentId
        - userId
        - status
        - amount
        - attemptedAt
      properties:
        id:
          type: string
          example: log-1
        paymentId:
          type: string
          example: payment-123
        userId:
          type: string
          example: user-123
        status:
          type: string
          enum: [READY, PAID, CANCELED, FAILED]
          example: PAID
        amount:
          type: number
          example: 50000
        attemptedAt:
          type: string
          format: date-time
          example: '2026-01-18T10:00:00Z'
        failureReason:
          type: string
          nullable: true
          description: 실패 사유 (status가 FAILED인 경우)
          example: 카드 한도 초과

    PaymentLogsResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - items
            - total
            - limit
            - offset
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PaymentLog'
            total:
              type: integer
              description: 전체 로그 개수
              example: 150
            limit:
              type: integer
              description: 페이지 크기
              example: 20
            offset:
              type: integer
              description: 페이지 오프셋
              example: 0

    ReissueReceiptRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: 영수증을 발송할 이메일 주소
          example: customer@example.com

    ReissueReceiptResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - orderId
            - email
            - issuedAt
            - status
          properties:
            orderId:
              type: string
              example: order-123
            email:
              type: string
              format: email
              example: customer@example.com
            issuedAt:
              type: string
              format: date-time
              example: '2026-01-18T10:30:00Z'
            status:
              type: string
              enum: [PENDING, SENT, FAILED]
              description: 발급 상태
              example: PENDING
        message:
          type: string
          example: 영수증 재발급이 요청되었습니다

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: 에러 메시지
          example: 잘못된 요청입니다
